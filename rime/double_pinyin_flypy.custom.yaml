  - derive/uan$/Ⓡ/
  - derive/[uv]e$/Ⓣ/
  - derive/un$/Ⓨ/
  - derive/^sh/Ⓤ/
  - derive/^ch/Ⓘ/
  - derive/^zh/Ⓥ/
  - derive/uo$/Ⓞ/
  - derive/ie$/Ⓟ/
  - derive/(.)i?ong$/$1Ⓢ/
  - derive/ing$|uai$/Ⓚ/
  - derive/(.)ai$/$1Ⓓ/
  - derive/(.)en$/$1Ⓕ/
  - derive/(.)eng$/$1Ⓖ/
  - derive/[iu]ang$/Ⓛ/
  - derive/(.)ang$/$1Ⓗ/
  - derive/ian$/Ⓜ/
  - derive/(.)an$/$1Ⓙ/
  - derive/(.)ou$/$1Ⓩ/
